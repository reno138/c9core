<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0c870"/>
      <stop offset="50%" stop-color="#c4a951"/>
      <stop offset="100%" stop-color="#8a7538"/>
    </linearGradient>
    <linearGradient id="ice" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a8d8f0"/>
      <stop offset="100%" stop-color="#3a5a8a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Shield shape -->
  <path d="M32 4 L56 16 L56 36 Q56 52 32 60 Q8 52 8 36 L8 16 Z" 
        fill="#0c1020" stroke="url(#gold)" stroke-width="2"/>
  <!-- Inner shield highlight -->
  <path d="M32 8 L52 18 L52 35 Q52 49 32 56 Q12 49 12 35 L12 18 Z" 
        fill="none" stroke="#1c2438" stroke-width="0.5"/>
  <!-- Sword (vertical) -->
  <line x1="32" y1="14" x2="32" y2="48" stroke="url(#ice)" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)"/>
  <!-- Sword crossguard -->
  <line x1="24" y1="24" x2="40" y2="24" stroke="url(#gold)" stroke-width="2" stroke-linecap="round"/>
  <!-- Sword pommel -->
  <circle cx="32" cy="14" r="2" fill="url(#gold)"/>
  <!-- C9 text -->
  <text x="22" y="41" font-family="serif" font-weight="900" font-size="11" fill="url(#gold)" letter-spacing="1">C9</text>
</svg>
