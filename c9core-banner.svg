<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06080f"/>
      <stop offset="50%" stop-color="#0c1020"/>
      <stop offset="100%" stop-color="#06080f"/>
    </linearGradient>
    <linearGradient id="goldG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0c870"/>
      <stop offset="50%" stop-color="#c4a951"/>
      <stop offset="100%" stop-color="#8a7538"/>
    </linearGradient>
    <linearGradient id="iceG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a8d8f0"/>
      <stop offset="100%" stop-color="#3a5a8a"/>
    </linearGradient>
    <filter id="glowG">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowText">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Star field pattern -->
    <pattern id="stars" width="200" height="200" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="30" r="0.5" fill="rgba(255,255,255,0.15)"/>
      <circle cx="60" cy="12" r="0.7" fill="rgba(255,255,255,0.1)"/>
      <circle cx="110" cy="55" r="0.5" fill="rgba(126,184,212,0.12)"/>
      <circle cx="145" cy="25" r="0.6" fill="rgba(255,255,255,0.08)"/>
      <circle cx="180" cy="70" r="0.4" fill="rgba(196,169,81,0.1)"/>
      <circle cx="35" cy="85" r="0.5" fill="rgba(255,255,255,0.12)"/>
      <circle cx="90" cy="95" r="0.7" fill="rgba(126,184,212,0.08)"/>
      <circle cx="160" cy="120" r="0.5" fill="rgba(255,255,255,0.1)"/>
      <circle cx="50" cy="150" r="0.6" fill="rgba(196,169,81,0.08)"/>
      <circle cx="130" cy="170" r="0.4" fill="rgba(255,255,255,0.12)"/>
      <circle cx="75" cy="190" r="0.5" fill="rgba(126,184,212,0.1)"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="300" fill="url(#bgGrad)"/>
  <rect width="800" height="300" fill="url(#stars)"/>
  
  <!-- Atmospheric glow -->
  <ellipse cx="400" cy="150" rx="350" ry="100" fill="rgba(20,35,80,0.3)"/>
  <ellipse cx="400" cy="280" rx="300" ry="60" fill="rgba(10,20,55,0.4)"/>
  
  <!-- Decorative border -->
  <rect x="20" y="20" width="760" height="260" rx="8" fill="none" stroke="#1c2438" stroke-width="1"/>
  <line x1="20" y1="21" x2="780" y2="21" stroke="url(#goldG)" stroke-width="1" opacity="0.5"/>
  
  <!-- Shield logo (left side) -->
  <g transform="translate(100, 70)">
    <path d="M50 0 L95 20 L95 60 Q95 90 50 105 Q5 90 5 60 L5 20 Z" 
          fill="#0c1020" stroke="url(#goldG)" stroke-width="2.5"/>
    <path d="M50 6 L89 24 L89 58 Q89 85 50 99 Q11 85 11 58 L11 24 Z" 
          fill="none" stroke="#1c2438" stroke-width="0.5"/>
    <!-- Sword -->
    <line x1="50" y1="18" x2="50" y2="85" stroke="url(#iceG)" stroke-width="3.5" stroke-linecap="round" filter="url(#glowG)"/>
    <line x1="36" y1="36" x2="64" y2="36" stroke="url(#goldG)" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="50" cy="18" r="3" fill="url(#goldG)"/>
    <!-- Three nodes (cluster) -->
    <circle cx="30" cy="65" r="4" fill="none" stroke="url(#iceG)" stroke-width="1.5" opacity="0.8"/>
    <circle cx="50" cy="55" r="4" fill="none" stroke="url(#iceG)" stroke-width="1.5" opacity="0.8"/>
    <circle cx="70" cy="65" r="4" fill="none" stroke="url(#iceG)" stroke-width="1.5" opacity="0.8"/>
    <!-- Node connections -->
    <line x1="34" y1="63" x2="46" y2="57" stroke="url(#iceG)" stroke-width="0.8" opacity="0.5"/>
    <line x1="54" y1="57" x2="66" y2="63" stroke="url(#iceG)" stroke-width="0.8" opacity="0.5"/>
    <line x1="34" y1="65" x2="66" y2="65" stroke="url(#iceG)" stroke-width="0.8" opacity="0.5"/>
  </g>
  
  <!-- Title text -->
  <text x="260" y="130" font-family="serif" font-weight="900" font-size="72" fill="url(#goldG)" letter-spacing="8" filter="url(#glowText)">C9CORE</text>
  
  <!-- Subtitle -->
  <text x="265" y="165" font-family="serif" font-weight="400" font-size="16" fill="#7eb8d4" letter-spacing="6" text-transform="uppercase" opacity="0.9">DISTRIBUTED WORLD SERVER</text>
  
  <!-- Divider line -->
  <line x1="265" y1="180" x2="700" y2="180" stroke="url(#goldG)" stroke-width="0.5" opacity="0.4"/>
  
  <!-- Feature tags -->
  <text x="265" y="210" font-family="serif" font-size="12" fill="#b0a898" letter-spacing="3">
    <tspan>CROSS-NODE TELEPORT</tspan>
    <tspan dx="20" fill="#3a5a6a">&#x2022;</tspan>
    <tspan dx="20">SEAMLESS ZONES</tspan>
    <tspan dx="20" fill="#3a5a6a">&#x2022;</tspan>
    <tspan dx="20">AUTO FAILOVER</tspan>
  </text>
  
  <!-- Version / WoW reference -->
  <text x="265" y="240" font-family="serif" font-size="11" fill="#8a7538" letter-spacing="4">WRATH OF THE LICH KING 3.3.5a</text>
  
  <!-- Bottom accent -->
  <line x1="100" y1="278" x2="700" y2="278" stroke="url(#goldG)" stroke-width="0.5" opacity="0.3"/>
</svg>
